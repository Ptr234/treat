services:
  postgres:
    image: postgres:16-alpine
    container_name: osc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: osc_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - osc_pgdata:/var/lib/postgresql/data

volumes:
  osc_pgdata:
