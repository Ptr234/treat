# oscdigitaltool.com — the website (osc-web.service on 127.0.0.1:3010).
# Installed as /etc/nginx/sites-available/osc-web by deploy/vps-install.sh.
# Starts HTTP-only; once DNS points here, `certbot --nginx -d oscdigitaltool.com
# -d www.oscdigitaltool.com` adds the 443 server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name oscdigitaltool.com www.oscdigitaltool.com;

    client_max_body_size 30m;

    # Hashed build assets: served straight from disk, cacheable for a year.
    location /_next/static/ {
        alias /var/www/osc/web/.next/static/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
