# Minimal config for `@cloudflare/vitest-pool-workers` — deliberately omits
# Hyperdrive and the rate-limit `unsafe.bindings` from wrangler.toml: Miniflare
# simulates KV/R2 locally without a real resource ID, but Hyperdrive needs a
# real (or locally-tunnelled) Postgres connection, and rate-limit bindings are
# a newer feature whose local-simulation support wasn't verified while
# scaffolding this. Phase 1's tests only cover pure logic (jwt/password/totp)
# that doesn't touch either. Expand this file once a slice's tests need a
# real DB or rate-limit binding under test.
name = "osc-api-test"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "test-kv"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "test-documents"
