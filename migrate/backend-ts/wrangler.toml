#:schema node_modules/wrangler/config-schema.json
name = "osc-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── Non-secret config (safe to commit) ──────────────────────────────────
# Secrets (JWT_SECRET, GROQ_API_KEY, RESEND_API_KEY, GOOGLE_CLIENT_ID,
# RECAPTCHA_SECRET_KEY, SENTRY_DSN, SEED_ADMIN_PASSWORD) are set with
# `wrangler secret put <NAME>` — never listed here. See README.md.
[vars]
JWT_ISSUER = "osc-api"
JWT_EXPIRY_HOURS = "24"
SITE_URL = "https://www.oscdigitaltool.com"
COOKIE_DOMAIN = ".oscdigitaltool.com"
CORS_ALLOWED_ORIGINS = "https://www.oscdigitaltool.com,http://localhost:3000"
# Toggle so the app can run before every resource has a Neon/Hyperdrive slice
# ready — see individual route files for what's actually wired up yet.
# Matches production reality, not a guess: Render's Resend__AdminEmail is
# actually unset, so EmailService.cs's `?? _fromAddress` fallback means
# escalation notifications go to the FromAddress, not a dedicated admin inbox.
# Confirmed against Render's dashboard on the date this was set — if that
# changes (a real admin inbox gets configured), update this to match.
RUN_MIGRATIONS_ON_STARTUP = "false"
RESEND_ADMIN_EMAIL = "notifications@oscdigitaltool.com"

# ── Postgres (Neon) via Hyperdrive ───────────────────────────────────────
# Create with: wrangler hyperdrive create osc-db --connection-string="<Neon pooled connection string>"
# Then paste the returned id below. One Hyperdrive config per environment
# (dev/staging/prod) pointing at the corresponding Neon branch.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

# ── File storage (replaces the local-disk /uploads simulation) ─────────
# Create with: wrangler r2 bucket create osc-documents
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "osc-documents"

# ── KV: rate-limit counters (windows >60s that the native Rate Limiting
# binding can't express) + light settings cache ─────────────────────────
# Create with: wrangler kv namespace create RATE_LIMITS
[[kv_namespaces]]
binding = "RATE_LIMITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# ── Native Workers Rate Limiting bindings ───────────────────────────────
# Only windows <= 60s fit this binding (Cloudflare's current constraint);
# longer windows (login: 5min, password-reset: 15min) are implemented with
# the RATE_LIMITS KV namespace instead — see src/lib/rate-limit.ts.
# NOTE: verify this exact TOML shape against current `wrangler docs` /
# dashboard before first deploy — rate-limiting bindings are a newer,
# still-evolving Workers feature and the config key may have moved since.
[[unsafe.bindings]]
name = "RL_CHATBOT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "RL_PUBLIC_FORM"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# ── Environments ─────────────────────────────────────────────────────────
# Duplicate the bindings above under [env.staging] / [env.production] once
# separate Neon branches / R2 buckets / KV namespaces exist for each, e.g.:
# [env.staging]
# [[env.staging.hyperdrive]]
# binding = "HYPERDRIVE"
# id = "..."
