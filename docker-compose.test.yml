services:
  # PostgreSQL Database for Backend
  postgres:
    image: postgres:15-alpine
    container_name: osc-test-postgres
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass123
      POSTGRES_DB: osc_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osc-test-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=osc_test;Username=testuser;Password=testpass123"
      # Outside Development the app only migrates/seeds when asked to. Without
      # these two the database stays empty and there is no account to log in
      # with, so every authenticated test fails at the first request.
      RunMigrationsOnStartup: "true"
      Seed__AdminPassword: "Admin@2026!"
      Jwt__Secret: "test-secret-key-for-testing-only-change-in-production"
      Jwt__Issuer: "http://localhost:8080"
      Jwt__Audience: "http://localhost:3000"
      # NOTE: do not set Cookie__Domain for localhost — browsers reject a
      # Domain=.localhost cookie outright, which silently breaks sign-in.
      # The browser must be able to reach the API at the same origin it was
      # given at build time, and that origin must be allowed by CORS.
      Cors__AllowedOrigins: "http://localhost:3000"
      SiteUrl: "http://localhost:3000"
      Resend__ApiKey: "test-resend-key"
      Resend__AdminEmail: "admin@test.local"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend (for e2e tests)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* is inlined into the browser bundle at build time, so it
      # must be a build arg. It also has to be an origin the *browser* can
      # resolve — "http://backend:8080" only exists inside the compose network.
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:8080"
        NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
    container_name: osc-test-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Must match the backend's Jwt__Secret, or the Next middleware rejects
      # every session the API issues and bounces /dashboard to the homepage.
      JWT_SECRET: "test-secret-key-for-testing-only-change-in-production"
    ports:
      - "3000:3000"
    healthcheck:
      # node:20-alpine has no curl — use the runtime's own fetch, otherwise this
      # check can never pass and anything waiting on it blocks indefinitely.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend test suite. Needs the .NET SDK — the previous single "test-runner"
  # ran `dotnet test` inside node:20-alpine, where dotnet does not exist, and
  # swallowed the failure with `|| true` so the run always looked green.
  backend-tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: osc-test-backend-tests
    profiles: ["test"]
    working_dir: /src
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      HOME: /tmp
    volumes:
      - ./backend:/src
      - ./test-results:/test-results
    command: >
      bash -lc "dotnet test OscApi.sln --logger:trx --results-directory:/test-results/backend"

  # Frontend unit tests + Playwright e2e. The image tag must track the
  # @playwright/test version in frontend/package.json so the bundled browsers
  # match the client library.
  frontend-tests:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    container_name: osc-test-frontend-tests
    profiles: ["test"]
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    working_dir: /app
    environment:
      CI: "true"
      # Inside the compose network the app answers to its service name.
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      TEST_API_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./test-results:/test-results
    command: >
      bash -lc "npm ci --legacy-peer-deps && npm run test:coverage && npm run test:e2e"

volumes:
  postgres_test_data:

networks:
  default:
    name: osc-test-network
