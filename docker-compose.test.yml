services:
  # PostgreSQL Database for Backend
  postgres:
    image: postgres:15-alpine
    container_name: osc-test-postgres
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass123
      POSTGRES_DB: osc_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osc-test-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Testing
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=osc_test;Username=testuser;Password=testpass123"
      Jwt__Secret: "test-secret-key-for-testing-only-change-in-production"
      Jwt__Issuer: "http://localhost:8080"
      Jwt__Audience: "http://localhost:3000"
      Cookie__Domain: ".localhost"
      Resend__ApiKey: "test-resend-key"
      Resend__AdminEmail: "admin@test.local"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend/uploads:/app/uploads

  # Frontend (for e2e tests)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osc-test-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080
      NODE_ENV: test
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test Runner
  test-runner:
    image: node:20-alpine
    container_name: osc-test-runner
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    working_dir: /workspace
    environment:
      TEST_API_URL: http://backend:8080
      TEST_FRONTEND_URL: http://frontend:3000
      NODE_ENV: test
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/frontend/node_modules
      - /workspace/backend/bin
      - /workspace/backend/obj
    command: sh -c "
      echo '=== Starting Full Test Suite ===' &&
      echo 'Testing Backend...' &&
      cd backend && dotnet test --logger:trx --results-directory:../test-results/backend || true &&
      echo 'Testing Frontend...' &&
      cd ../frontend && npm run test:coverage || true &&
      echo 'Running E2E Tests...' &&
      npm run test:e2e || true &&
      echo '=== Test Suite Complete ==='
      "

volumes:
  postgres_test_data:

networks:
  default:
    name: osc-test-network
